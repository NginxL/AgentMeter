name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check core behavior
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/package.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: AgentMeter-${{ matrix.os }}-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
