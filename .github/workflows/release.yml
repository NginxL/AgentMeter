name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 1.0.0 (must match Info.plist)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            requested="$INPUT_VERSION"
          else
            requested="${REF_NAME#v}"
          fi
          if [[ ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$requested" != "$version" ]]; then
            printf 'Release version must match Info.plist (%s).\n' "$version" >&2
            exit 1
          fi
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              printf 'Tag %s points to a different commit; no release was published.\n' "$tag" >&2
              exit 1
            fi
          fi
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check core behavior
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/package.sh --universal
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists; published assets were preserved.\n' "$RELEASE_TAG"
            exit 0
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --target "$RELEASE_COMMIT" --title "AgentMeter $RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --verify-tag --title "AgentMeter $RELEASE_TAG" --generate-notes
          fi
